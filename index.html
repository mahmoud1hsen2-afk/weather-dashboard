<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="dashboard">
    <header>
      <p class="subtitle">Mahmoud Majed</p>
      <h1>Weather Dashboard</h1>
      <p>Search for a city to check its current weather.</p>
    </header>
    <form id="search-form">
      <label for="city-input">City name</label>
      <div class="search-row">
        <input id="city-input" type="text" placeholder="e.g. Beirut or Paris,FR" autocomplete="off">
        <button id="search-button" type="submit">Search</button>
      </div>
    </form>
    <p id="loading" role="status" hidden>Loading weather...</p>
    <p id="error" role="alert" hidden></p>
    <section id="weather" aria-label="Current weather" hidden>
      <h2 id="city-name"></h2>
      <div class="current-weather">
        <img id="weather-icon" width="100" height="100" alt="">
        <p id="temperature"></p>
      </div>
      <p id="description"></p>
      <div class="details">
        <div><span>Feels like</span><strong id="feels-like"></strong></div>
        <div><span>Humidity</span><strong id="humidity"></strong></div>
        <div><span>Wind speed</span><strong id="wind"></strong></div>
      </div>
    </section>
    <footer>Weather data from OpenWeatherMap</footer>
  </main>
</body>
</html>
